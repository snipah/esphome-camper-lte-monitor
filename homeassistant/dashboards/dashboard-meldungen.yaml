# =====================================================================
# Camper: "Meldungen" (messages) view (path /lovelace/info)
#
# Shows the last notification in full (weekly report or
# warning) and the nine before it below. Tapping the notification on the
# phone opens exactly this page.
#
# Paste: open the "info" view > pencil on the view > "Edit in
# YAML", replace the entire content. The path "info" must stay as is;
# the notifications and the "Neue Meldung" badge point to it.
# =====================================================================
title: Meldungen
path: info
icon: mdi:message-text-outline
type: sections
max_columns: 2
sections:
- type: grid
  cards:
  - type: heading
    heading: Letzte Meldung
    heading_style: title
    icon: mdi:message-text-outline
  - type: markdown
    grid_options:
      columns: full
    content: |-
      {% set z = state_attr('sensor.possl_letzte_benachrichtigung', 'zeit') | as_datetime(none) %}
      {% set text = state_attr('sensor.possl_letzte_benachrichtigung', 'text') %}
      {% if z is none %}
      Noch keine Meldung verschickt.
      {% else %}
      ## {{ states('sensor.possl_letzte_benachrichtigung') }}

      {{ (z | as_local).strftime('%d.%m.%Y, %H:%M Uhr') }}

      {{ (text or '') | replace('\n', '  \n') }}
      {% endif %}
- type: grid
  cards:
  - type: heading
    heading: Frühere Meldungen
    heading_style: title
    icon: mdi:history
  - type: markdown
    grid_options:
      columns: full
    content: |-
      {% set v = state_attr('sensor.possl_letzte_benachrichtigung', 'verlauf') or [] %}
      {% if v | length > 1 %}
      {% for m in v[1:] %}
      **{{ m.title }}** &nbsp;·&nbsp; {{ (m.zeit | as_datetime | as_local).strftime('%d.%m. %H:%M') }}

      {{ m.text | replace('\n', '  \n') }}

      ---

      {% endfor %}
      {% else %}
      Noch keine früheren Meldungen.
      {% endif %}

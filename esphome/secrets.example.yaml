# Template for secrets.yaml in the ESPHome folder.
# Copy to secrets.yaml and replace all values.

# LTE (1NCE)
lte_apn: "sensor.net"   # 1NCE in my case; check your provider's portal if unsure

# Victron Instant Readout: MAC and key from VictronConnect
# (device > settings > product info > "Instant readout via Bluetooth" > Show)
shunt_mac: "AA:BB:CC:DD:EE:10"
shunt_bindkey: "00000000000000000000000000000000"
mppt_mac: "AA:BB:CC:DD:EE:11"
mppt_bindkey: "00000000000000000000000000000000"

# WireGuard: values from the WireGuard config your router generates for a
# new device (Fritz!Box: Internet > Permit Access > VPN (WireGuard))
wg_address: "192.168.0.250"
wg_private_key: "PRIVATE_KEY_DES_ESP"
wg_peer_endpoint: "deinname.myfritz.net"
wg_peer_port: "51820"
wg_peer_public_key: "PUBLIC_KEY_DER_FRITZBOX"
wg_peer_preshared_key: "PRESHARED_KEY"

# Home Assistant webhook in the home network; the ID must match webhook_id
# in homeassistant/poessl_monitor.yaml
ha_webhook_url: "http://192.168.0.X:8123/api/webhook/poessl-monitor-EIGENE-ZUFALLS-ID"

# Vorlage für die secrets.yaml im ESPHome-Ordner.
# Kopieren nach secrets.yaml und alle Werte ersetzen.

# LTE (1NCE)
lte_apn: "sensor.net"   # bei mir mit 1NCE; im Zweifel im Portal des Anbieters nachsehen

# Victron Instant Readout: MAC und Schlüssel aus VictronConnect
# (Gerät > Einstellungen > Produktinfo > "Instant readout via Bluetooth" > Show)
shunt_mac: "AA:BB:CC:DD:EE:10"
shunt_bindkey: "00000000000000000000000000000000"
mppt_mac: "AA:BB:CC:DD:EE:11"
mppt_bindkey: "00000000000000000000000000000000"

# WireGuard: Werte aus der WireGuard-Konfiguration, die die Fritz!Box
# für ein neues Gerät erzeugt (Internet > Freigaben > VPN (WireGuard))
wg_address: "192.168.0.250"
wg_private_key: "PRIVATE_KEY_DES_ESP"
wg_peer_endpoint: "deinname.myfritz.net"
wg_peer_port: "51820"
wg_peer_public_key: "PUBLIC_KEY_DER_FRITZBOX"
wg_peer_preshared_key: "PRESHARED_KEY"

# Webhook von Home Assistant im Heimnetz; die ID muss mit webhook_id in
# homeassistant/poessl_monitor.yaml übereinstimmen
ha_webhook_url: "http://192.168.0.X:8123/api/webhook/poessl-monitor-EIGENE-ZUFALLS-ID"

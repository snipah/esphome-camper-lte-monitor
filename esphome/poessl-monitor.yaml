# =====================================================================
# Camper battery remote monitor
# LilyGO T-A7670E (ESP32-WROVER-E + A7670E LTE Cat-1), 1NCE SIM
#
# Each cycle:
#   wake up -> power up modem -> LTE -> WireGuard to the home router
#   -> read Victron, Mopeka, Inkbird and the BMS via Bluetooth
#   -> send one JSON via HTTP to Home Assistant
#   -> modem off -> deep sleep
#
# Flash via USB (no WiFi, no OTA):
#   esphome run poessl-monitor.yaml
# =====================================================================

substitutions:
  # "true" = test mode: device stays awake, modem stays on, no deep sleep.
  stay_awake: "false"
  # Report interval in minutes: normal and at low state of charge
  sleep_normal_min: "30"
  sleep_alert_min: "15"
  soc_alert_threshold: "30"
  # Report less often at night to save data. Times as full hours
  # (local time). At low state of charge the short interval above
  # applies at night as well.
  sleep_night_min: "120"
  night_start_hour: "22"
  night_end_hour: "6"
  # Bluetooth address of the CBT Power BMS in the house battery
  bms_mac: "AA:BB:CC:DD:EE:01"

esphome:
  name: poessl-monitor
  friendly_name: Poessl Monitor
  includes:
    # For esp_sntp_restart() in the modem's on_connect
    - "<esp_sntp.h>"
    # For esp_reset_reason() in the boot-failure guard
    - "<esp_system.h>"
  on_boot:
    priority: 600
    then:
      - script.execute: bms_guard
      - script.execute: run_cycle
  on_shutdown:
    then:
      # Runs before every deep sleep, even when the emergency brake (run_duration)
      # kicks in, and before every reboot.
      #
      # With 5 V supplied via VBUS, GPIO12 does NOT cut power to the modem
      # (schematic V1.4: VBUS and IO12 are OR-ed). It is therefore shut down
      # with AT+CPOF, always, no matter how the cycle ends.
      #
      # Exception: with the boot-failure guard the modem component is not set
      # up yet, so AT+CPOF has no effect. The modem then stays on until the
      # next regular cycle.
      #
      # Then hold the control lines during sleep:
      #   GPIO5 (reset)  LOW, otherwise a glitch on wake-up starts the modem
      #                  by itself.
      #   GPIO4 (PWRKEY) LOW, so the floating pin does not switch the modem
      #                  on during sleep.
      - lambda: |-
          // According to the A76XX AT manual (V1.09) the modem answers AT+CPOF
          // with OK within 9 s, saves its data, detaches from the network
          // and powers off.
          auto r = id(lte).send_at("AT+CPOF", 9000);
          ESP_LOGI("sleep", "AT+CPOF: %s", r.success ? "OK" : "no response");
          if (r.success) {
            // Give the modem time to detach and shut down
            delay(4000);
          }
          gpio_set_level(GPIO_NUM_4, 0);
          gpio_set_level(GPIO_NUM_5, 0);
          gpio_set_level(GPIO_NUM_12, 0);
          gpio_hold_en(GPIO_NUM_4);
          gpio_hold_en(GPIO_NUM_5);
          gpio_deep_sleep_hold_en();

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # The modem component has some long blocking calls.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

external_components:
  # Modem component (PPP over UART). Not in official ESPHome yet,
  # so taken directly from pull request esphome/esphome#6721.
  # Pinned to a fixed commit (state of the PR on 2026-09-26) so a later
  # build does not silently pull different code. Change the commit here
  # deliberately to update.
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: 7746f5d4833ce1d6b010e485ef56aceaf8b8038b
    components: [modem, network]
  - source: github://Fabian-Schmidt/esphome-victron_ble
    refresh: 1d

logger:
  # DEBUG for commissioning, INFO later.
  level: DEBUG

# ---------------------------------------------------------------------
# Cellular
# ---------------------------------------------------------------------
modem:
  id: lte
  tx_pin: GPIO26
  rx_pin: GPIO27
  baud_rate: 115200
  # The A7670E speaks the SIM7600 command set. SIM7600 and SIM7670 produce
  # the same driver in the component. If it does not sync, the only
  # alternative is GENERIC.
  model: SIM7600
  apn: !secret lte_apn
  # Only enabled after the power-up sequence in the script.
  enable_on_boot: false
  # Longer than run_duration so deep sleep always wins.
  reboot_timeout: 10min
  on_sync:
    # Log the modem firmware revision. For the A7670E-LNXY-UBL LilyGO lists
    # a revision with the bug "Unable to open network".
    - lambda: |-
        auto r = id(lte).send_at("AT+SIMCOMATI", 3000);
        ESP_LOGI("modem", "AT+SIMCOMATI: %s", r.c_str());
  on_connect:
    # SNTP starts at boot, i.e. before the network is up, and afterwards only
    # retries on a coarse schedule. Kick it off again right away so that
    # after a cold start the time (and thus the tunnel) is ready quickly.
    - lambda: |-
        esp_sntp_restart();

# ---------------------------------------------------------------------
# Tunnel to home
# ---------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    # Local time is needed for the night interval.
    timezone: Europe/Berlin

wireguard:
  id: wg
  time_id: sntp_time
  address: !secret wg_address
  # /24 so the whole home network is routed through the tunnel.
  netmask: 255.255.255.0
  private_key: !secret wg_private_key
  peer_endpoint: !secret wg_peer_endpoint
  peer_port: !secret wg_peer_port
  peer_public_key: !secret wg_peer_public_key
  peer_preshared_key: !secret wg_peer_preshared_key
  # Only the home network goes through the tunnel, everything else stays out.
  peer_allowed_ips:
    - 192.168.0.0/24
  # No keepalive: the tunnel only lives a few seconds per cycle.
  peer_persistent_keepalive: 0s
  reboot_timeout: 0s
  update_interval: 5s

mdns:
  disabled: true

# ---------------------------------------------------------------------
# Reporting: one HTTP request per cycle to the Home Assistant webhook
# ---------------------------------------------------------------------
# No broker in between. Home Assistant is reachable directly through the
# tunnel and confirms receipt with status code 200.
#
# Entry in secrets.yaml (insert the IP of Home Assistant):
#   ha_webhook_url: "http://192.168.0.X:8123/api/webhook/poessl-monitor-EIGENE-ZUFALLS-ID"
http_request:
  id: http_client
  timeout: 10s
  watchdog_timeout: 15s
  verify_ssl: false

# ---------------------------------------------------------------------
# Error counters, stored in flash
# ---------------------------------------------------------------------
# The boot-failure guard counts skipped cycles here and remembers the
# last reset reason. Both are sent home with the next successful report
# and reset to 0 afterwards. Flash is only written on a failed boot and
# on the first report after it, so it is spared.
globals:
  # Planned sleep time in minutes, set in plan_sleep.
  - id: next_sleep_min
    type: int
    restore_value: false
    initial_value: '0'
  - id: skipped_cycles
    type: int
    restore_value: true
    initial_value: '0'
  - id: last_fault
    type: int
    restore_value: true
    initial_value: '0'
  # Command of the last valid BMS response, -1 = none yet.
  # The query waits for it before sending the next command.
  - id: bms_last_cmd
    type: int
    restore_value: false
    initial_value: '-1'
  # Set as soon as the BMS query has delivered cell values.
  - id: bms_done
    type: bool
    restore_value: false
    initial_value: 'false'
  # Shunt current before the modem starts, see run_cycle.
  - id: idle_current
    type: float
    restore_value: false
    initial_value: 'NAN'
  # Set when Home Assistant has confirmed receipt of the report.
  - id: send_ok
    type: bool
    restore_value: false
    initial_value: 'false'

# ---------------------------------------------------------------------
# Deep sleep
# ---------------------------------------------------------------------
deep_sleep:
  id: deep_sleep_ctrl
  # Emergency brake: if the cycle hangs (no network, no tunnel), the device
  # goes to sleep after this time anyway. The waits in the script add up to
  # just under 4 minutes in the worst case, hence 5 minutes.
  run_duration: 5min
  sleep_duration: ${sleep_normal_min}min

# ---------------------------------------------------------------------
# Modem control lines of the T-A7670
# ---------------------------------------------------------------------
switch:
  # Modem power (BOARD_POWERON_PIN). On right at boot.
  - platform: gpio
    id: modem_power
    pin:
      number: GPIO12
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
  # Reset, active HIGH
  - platform: gpio
    id: modem_reset
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
  # Modem power key
  - platform: gpio
    id: modem_pwrkey
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  # DTR LOW keeps the modem awake
  - platform: gpio
    id: modem_dtr
    pin: GPIO25
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------
# Victron via Bluetooth (Instant Readout)
# ---------------------------------------------------------------------
esp32_ble_tracker:
  scan_parameters:
    # Active, so sensors that only send their readings in the scan response
    # (Inkbird) are heard too. Victron and Mopeka don't mind.
    active: true
    interval: 320ms
    window: 300ms
    # While the BMS connection is up, only scan briefly. Otherwise the scan
    # occupies the radio almost completely and the connection starves
    # (first test: dropped after 11 s with reason 0x08 before the BMS
    # could answer at all).
    connection_scan_window: 30ms
  on_ble_advertise:
    # Like the ESPHome Bluetooth proxy: set short connection intervals for
    # the BMS before connecting (7.5 ms). The plain ble_client does not set
    # these by itself. In a test on 2026-10-08 reading the twelve services
    # took about 1 s with them; without them it did not finish in 11 s.
    # The timeout is 5 s instead of 10 s as in the proxy: a dead connection
    # attempt ends sooner, leaving time for more attempts.
    - mac_address: ${bms_mac}
      then:
        - lambda: |-
            static bool gesetzt = false;
            if (!gesetzt) {
              uint64_t a = x.address_uint64();
              esp_bd_addr_t bda = {(uint8_t) (a >> 40), (uint8_t) (a >> 32), (uint8_t) (a >> 24),
                                   (uint8_t) (a >> 16), (uint8_t) (a >> 8), (uint8_t) a};
              esp_err_t err = esp_ble_gap_set_prefer_conn_params(bda, 0x06, 0x06, 0, 500);
              ESP_LOGI("bms", "Connection parameters set as in the proxy: %s", err == ESP_OK ? "OK" : "error");
              gesetzt = true;
            }

victron_ble:
  - id: smart_shunt
    mac_address: !secret shunt_mac
    bindkey: !secret shunt_bindkey
  - id: smart_solar
    mac_address: !secret mppt_mac
    bindkey: !secret mppt_bindkey

# ---------------------------------------------------------------------
# House battery BMS (CBT Power) via Bluetooth
# ---------------------------------------------------------------------
# Unlike Victron, the BMS does not broadcast its values; it has to be
# connected to and queried. The monitor connects once per cycle as
# soon as it sees the BMS, queries it and releases it right away.
#
# The BMS only accepts one connection. If another device (e.g. a Cerbo)
# is connected, the BMS is invisible to the monitor and the cell values
# stay empty. That is intended.
#
# Protocol (from the aiobmsble library, module cbtpwr_bms):
#   Request:  AA 55 <cmd> 00 <checksum> 0A 0D   to FFE5/FFE9
#   Response: AA 55 <cmd> <len> <data> <checksum> 0D 0A   from FFE0/FFE4
#   Checksum = sum of cmd, len and data, low byte
# If the battery shows up as "VB..." in a Bluetooth scan, it speaks a
# different protocol (cbtpwr_vb_bms) and this query does not fit.
ble_client:
  - id: bms_client
    mac_address: ${bms_mac}
    auto_connect: true
    on_connect:
      then:
        - script.execute: query_bms
    on_disconnect:
      then:
        # Stop a running query so the next connection starts
        # cleanly from scratch.
        - script.stop: query_bms
        - script.stop: bms_request

# All sensors only have an id, i.e. internal. They are not published
# individually but collected in the script.
sensor:
  - platform: victron_ble
    victron_ble_id: smart_shunt
    id: shunt_soc
    type: STATE_OF_CHARGE
  - platform: victron_ble
    victron_ble_id: smart_shunt
    id: shunt_voltage
    type: BATTERY_VOLTAGE
  - platform: victron_ble
    victron_ble_id: smart_shunt
    id: shunt_current
    type: BATTERY_CURRENT
  - platform: victron_ble
    victron_ble_id: smart_shunt
    id: shunt_consumed_ah
    type: CONSUMED_AH
  - platform: victron_ble
    victron_ble_id: smart_shunt
    id: shunt_time_to_go
    type: TIME_TO_GO
  - platform: victron_ble
    victron_ble_id: smart_shunt
    id: shunt_starter_voltage
    type: AUX_VOLTAGE

  - platform: victron_ble
    victron_ble_id: smart_solar
    id: mppt_pv_power
    type: PV_POWER
  - platform: victron_ble
    victron_ble_id: smart_solar
    id: mppt_yield_today
    type: YIELD_TODAY
  - platform: victron_ble
    victron_ble_id: smart_solar
    id: mppt_battery_current
    type: BATTERY_CURRENT
  # Current on the charge controller's load output. The starter battery
  # maintenance charger is connected there. Reported in 0.1 A steps.
  - platform: victron_ble
    victron_ble_id: smart_solar
    id: mppt_load_current
    type: LOAD_CURRENT

  # Gas cylinder (Mopeka Standard)
  - platform: mopeka_std_check
    mac_address: AA:BB:CC:DD:EE:02
    # Calibration measured on my own cylinder; adjust it to yours.
    tank_type: CUSTOM
    custom_distance_full: 290mm
    custom_distance_empty: 28mm
    propane_butane_mix: 20%
    level:
      id: gas_level
      filters:
        - clamp:
            min_value: 0
            max_value: 100
    temperature:
      id: gas_temp
    battery_level:
      id: gas_battery

  # Inkbird thermometers: interior and technical area next to the Multiplus
  - platform: inkbird_ibsth1_mini
    mac_address: AA:BB:CC:DD:EE:03
    temperature:
      id: room_temp
    humidity:
      id: room_humidity
    battery_level:
      id: room_battery

  - platform: inkbird_ibsth1_mini
    mac_address: AA:BB:CC:DD:EE:04
    temperature:
      id: multiplus_temp
    battery_level:
      id: multiplus_battery

  # Fridge. The sensor can have an external probe: if plugged in, the
  # sensor only reports the probe value, otherwise the built-in one. The
  # value that is available gets sent.
  - platform: inkbird_ibsth1_mini
    mac_address: AA:BB:CC:DD:EE:05
    temperature:
      id: fridge_temp_int
    external_temperature:
      id: fridge_temp_ext
    battery_level:
      id: fridge_battery

  # Freezer
  - platform: inkbird_ibsth1_mini
    mac_address: AA:BB:CC:DD:EE:06
    temperature:
      id: freezer_temp
    battery_level:
      id: freezer_battery

  # BMS responses. Each notification contains exactly one response;
  # the lambda checks it and distributes the values to the sensors below.
  - platform: ble_client
    type: characteristic
    ble_client_id: bms_client
    id: bms_rx
    service_uuid: 'FFE0'
    characteristic_uuid: 'FFE4'
    notify: true
    update_interval: never
    lambda: |-
      if (x.size() < 7 || x[0] != 0xAA || x[1] != 0x55) {
        return NAN;
      }
      const size_t len = x[3];
      if (x.size() != 7 + len) {
        return NAN;
      }
      uint8_t crc = 0;
      for (size_t i = 2; i < 4 + len; i++) {
        crc += x[i];
      }
      if (crc != x[4 + len]) {
        ESP_LOGW("bms", "Checksum wrong for command 0x%02X", x[2]);
        return NAN;
      }
      auto u16 = [&x](size_t pos) -> uint16_t {
        return (uint16_t) (x[pos] | (x[pos + 1] << 8));
      };
      switch (x[2]) {
        case 0x05:  // response contains cells 1 to 5 in mV; the battery has four, the fifth is unused
          if (len >= 8) {
            id(bms_cell1).publish_state(u16(4) / 1000.0f);
            id(bms_cell2).publish_state(u16(6) / 1000.0f);
            id(bms_cell3).publish_state(u16(8) / 1000.0f);
            id(bms_cell4).publish_state(u16(10) / 1000.0f);
          }
          break;
        case 0x0A:  // BMS state of charge in percent, one byte
          if (len >= 1) {
            id(bms_soc).publish_state(x[4]);
          }
          break;
        case 0x09:  // temperature in °C, signed
          if (len >= 2) {
            id(bms_temp).publish_state((int16_t) u16(4));
          }
          break;
        case 0x15:  // nominal capacity and charge cycles
          if (len >= 4) {
            id(bms_cycles).publish_state(u16(6));
          }
          break;
        case 0x21:  // error code, 0 = no error
          if (len >= 4) {
            id(bms_fault).publish_state(
                (uint32_t) x[4] | ((uint32_t) x[5] << 8) | ((uint32_t) x[6] << 16) | ((uint32_t) x[7] << 24));
          }
          break;
        default:
          break;
      }
      ESP_LOGD("bms", "Response to command 0x%02X, %u data bytes", x[2], (unsigned) len);
      id(bms_last_cmd) = x[2];
      return x[2];

  - platform: template
    id: bms_cell1
    accuracy_decimals: 3
  - platform: template
    id: bms_cell2
    accuracy_decimals: 3
  - platform: template
    id: bms_cell3
    accuracy_decimals: 3
  - platform: template
    id: bms_cell4
    accuracy_decimals: 3
  - platform: template
    id: bms_temp
  - platform: template
    id: bms_cycles
  - platform: template
    id: bms_fault
  - platform: template
    id: bms_soc
    accuracy_decimals: 0

text_sensor:
  - platform: victron_ble
    victron_ble_id: smart_solar
    id: mppt_state
    type: DEVICE_STATE

# ---------------------------------------------------------------------
# Sequencing
# ---------------------------------------------------------------------
script:
  # Send one command to the BMS and wait for the matching response.
  # As in the library of the Home Assistant integration: no fixed
  # pauses, but wait until the response is there, otherwise retry up to
  # three times.
  #
  # Writing uses the standard ESPHome action. It remembers the write
  # characteristic on connect. Looking it up yourself via
  # get_characteristic() does NOT work here: ESPHome releases the service
  # list right after connecting ("services released").
  # The action picks the write type (with response) itself; the BMS
  # answers to that (checked against aiobmsble on 2026-10-08).
  - id: bms_request
    mode: single
    parameters:
      cmd: int
    then:
      - lambda: |-
          id(bms_last_cmd) = -1;
      - repeat:
          count: 3
          then:
            - if:
                condition:
                  lambda: 'return id(bms_last_cmd) != cmd;'
                then:
                  - ble_client.ble_write:
                      id: bms_client
                      service_uuid: 'FFE5'
                      characteristic_uuid: 'FFE9'
                      # AA 55 <cmd> 00 <checksum = cmd> 0A 0D
                      value: !lambda |-
                        return std::vector<uint8_t>{0xAA, 0x55, (uint8_t) cmd, 0x00, (uint8_t) cmd, 0x0A, 0x0D};
                  - wait_until:
                      condition:
                        lambda: 'return id(bms_last_cmd) == cmd;'
                      timeout: 1s
      - if:
          condition:
            lambda: 'return id(bms_last_cmd) != cmd;'
          then:
            - logger.log:
                level: WARN
                format: "BMS: no response to command 0x%02X"
                args: ['cmd']

  # Query the BMS as soon as the connection is up, then release it.
  #
  # The query has to run within the first seconds after connecting: in all
  # tests the connection dropped about 10 s after it was established (reason 0x08).
  # With the short connection intervals reading the services takes about
  # 1 s, the four queries need less than a second after that.
  - id: query_bms
    mode: single
    then:
      # Wait briefly until the notifications are subscribed.
      - delay: 500ms
      # Cell voltages
      - script.execute:
          id: bms_request
          cmd: 0x05
      - script.wait: bms_request
      - if:
          condition:
            lambda: 'return std::isnan(id(bms_cell1).state);'
          then:
            # No cell values: disconnect. The monitor reconnects by itself on
            # the next BMS advertisement and queries again until the
            # guard (bms_guard) stops the attempts.
            - logger.log:
                level: WARN
                format: "BMS: no cell values, retrying"
            - ble_client.disconnect: bms_client
          else:
            # BMS state of charge
            - script.execute:
                id: bms_request
                cmd: 0x0A
            - script.wait: bms_request
            # Temperature
            - script.execute:
                id: bms_request
                cmd: 0x09
            - script.wait: bms_request
            # Charge cycles
            - script.execute:
                id: bms_request
                cmd: 0x15
            - script.wait: bms_request
            # Error code
            - script.execute:
                id: bms_request
                cmd: 0x21
            - script.wait: bms_request
            - logger.log: "BMS: query successful"
            # Disconnect and don't reconnect during this cycle, so the BMS
            # is free for other devices. Afterwards the monitor scans with
            # the full window again.
            - lambda: |-
                id(bms_done) = true;
                id(bms_client).set_enabled(false);

  # Guard: if the BMS query does not succeed, stop the connection attempts
  # after 45 s. Single failed attempts are normal with this BMS; the
  # Home Assistant integration also had regular timeouts and retried.
  # Hence time for several attempts. Otherwise the throttled scan would
  # last for the rest of the cycle and the other sensors would miss out.
  - id: bms_guard
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return id(bms_done);'
          timeout: 45s
      - if:
          condition:
            lambda: 'return !id(bms_done);'
          then:
            - logger.log:
                level: WARN
                format: "BMS: query failed, giving up the connection"
            - script.stop: query_bms
            - script.stop: bms_request
            - lambda: |-
                id(bms_client).set_enabled(false);

  - id: run_cycle
    mode: single
    then:
      # Release the hold on the control lines from the last sleep.
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_4);
          gpio_hold_dis(GPIO_NUM_5);
          gpio_deep_sleep_hold_dis();
          // Reset reason to the log: 8 = wake from deep sleep (normal),
          // 1 = power on, 9 = brownout, 4 = crash, 5 to 7 = watchdog
          ESP_LOGI("boot", "Reset reason: %d", (int) esp_reset_reason());
      - if:
          condition:
            lambda: 'return ${stay_awake};'
          then:
            - deep_sleep.prevent: deep_sleep_ctrl
            - logger.log: "Test mode: deep sleep disabled"

      # Boot-failure guard: if the last run ended in a brownout, crash or
      # watchdog reset, an immediate new attempt could easily turn into a
      # boot loop without sleep that drains the battery. In that case don't
      # start the modem at all, go straight to sleep and try again at the
      # next regular wake-up.
      # Disabled in test mode so the problem stays visible in the log.
      - if:
          condition:
            lambda: |-
              if (${stay_awake}) {
                return false;
              }
              switch (esp_reset_reason()) {
                case ESP_RST_BROWNOUT:
                case ESP_RST_PANIC:
                case ESP_RST_INT_WDT:
                case ESP_RST_TASK_WDT:
                case ESP_RST_WDT:
                  return true;
                default:
                  return false;
              }
          then:
            - logger.log:
                level: WARN
                format: "Boot-failure guard: skipping cycle"
            # Count and write to flash right away, sleep follows immediately.
            - lambda: |-
                id(skipped_cycles) += 1;
                id(last_fault) = (int) esp_reset_reason();
                skipped_cycles->on_shutdown();
                last_fault->on_shutdown();
                global_preferences->sync();
            - script.execute: go_to_sleep
            - script.stop: run_cycle

      # Measure idle current before the modem starts. Later in the cycle the
      # monitor itself draws well over 1 W (modem, radio), so a snapshot then
      # would be far too high. The shunt sends about once per second. Only the
      # ESP32 with running Bluetooth scan is included (roughly 0.5 W).
      - wait_until:
          condition:
            lambda: 'return !std::isnan(id(shunt_current).state);'
          timeout: 8s
      - lambda: |-
          id(idle_current) = id(shunt_current).state;
          ESP_LOGI("shunt", "Current before modem start: %.3f A", id(idle_current));

      # Power-up sequence following the LilyGO examples
      - switch.turn_on: modem_power
      - delay: 500ms
      - switch.turn_off: modem_reset
      - delay: 100ms
      - switch.turn_on: modem_reset
      - delay: 2600ms
      - switch.turn_off: modem_reset
      - switch.turn_off: modem_dtr
      - switch.turn_off: modem_pwrkey
      - delay: 100ms
      # 1 s power-on pulse: as in the LilyGO wiki and as a retry in the
      # LilyGO examples. The datasheet asks for typically 50 ms to switch on
      # and at least 2.5 s to switch off, so a modem that is already running
      # is not switched off by accident.
      - switch.turn_on: modem_pwrkey
      - delay: 1000ms
      - switch.turn_off: modem_pwrkey
      # Give the modem time to boot. According to the SIMCom datasheet the
      # serial interface is typically ready 11.2 s after power-on.
      - delay: 12s
      # Finish the BMS query first, then start the modem component. Its start
      # blocked twice for 20 s each in the first test (2026-10-14); Bluetooth
      # starved during that time and the BMS query failed. (The actual cause
      # of the blocking was the modem echo, see below.) The extra wait also
      # gives the modem more time to boot.
      - wait_until:
          condition:
            lambda: 'return id(bms_done);'
          timeout: 30s
      # Turn off the modem echo before the modem component starts.
      # Cause of the two 20 s blocks in the first test: the component
      # detects the operating mode by sending a PPP test packet. With echo
      # on (factory default after every power-up) the modem sends the packet
      # back, the detection takes it for a PPP response
      # ("Autodetect mode: 2" = data mode) and spends 20 s trying to leave
      # a data mode the modem is not even in. Without echo the modem only
      # answers the following "AT" and is detected as command mode right
      # away. The A7670E rejects saving this permanently (AT&W), hence every
      # cycle. Up to five attempts in case the modem is not ready
      # yet.
      - lambda: |-
          for (int i = 1; i <= 5; i++) {
            auto r = id(lte).send_at("ATE0", 1000);
            if (r) {
              ESP_LOGI("modem", "Echo off (attempt %d)", i);
              return;
            }
            delay(200);
          }
          ESP_LOGW("modem", "ATE0 without response, modem not responding yet");
      - modem.enable

      # Wait for LTE and tunnel
      - wait_until:
          condition:
            wireguard.peer_online:
          timeout: 150s

      - if:
          condition:
            wireguard.peer_online:
          then:
            # Make sure the shunt has been heard. Checks the voltage: the
            # state of charge is missing until the shunt has synchronized and
            # would otherwise hold up every cycle.
            - wait_until:
                condition:
                  lambda: 'return !std::isnan(id(shunt_voltage).state);'
                timeout: 20s
            # Wait for the gas sensor too. It only reports every few seconds
            # and was otherwise missing in quick cycles (report from
            # 2026-10-08, 10:16). With the cylinder removed this costs
            # 15 s of awake time per cycle.
            - wait_until:
                condition:
                  lambda: 'return !std::isnan(id(gas_level).state);'
                timeout: 15s
            # And that the BMS query is done. Normally it finished long
            # before the network is up, so the wait does not apply.
            - wait_until:
                condition:
                  lambda: 'return !std::isnan(id(bms_cell1).state);'
                timeout: 10s
            # Send via HTTP to the Home Assistant webhook. If it answers
            # with 200, the report arrived. Otherwise a second attempt.
            - lambda: |-
                id(send_ok) = false;
            - repeat:
                count: 2
                then:
                  - if:
                      condition:
                        lambda: 'return !id(send_ok);'
                      then:
                        - script.execute: plan_sleep
                        - script.wait: plan_sleep
                        - http_request.post:
                            url: !secret ha_webhook_url
                            request_headers:
                              Content-Type: application/json
                            json: |-
                              root["ts"] = id(sntp_time).now().timestamp;
                              root["soc"] = id(shunt_soc).state;
                              root["voltage"] = id(shunt_voltage).state;
                              // Current before modem start (see run_cycle), otherwise the current one
                              root["current"] = std::isnan(id(idle_current)) ? id(shunt_current).state : id(idle_current);
                              root["current_awake"] = id(shunt_current).state;
                              root["consumed_ah"] = id(shunt_consumed_ah).state;
                              root["time_to_go_min"] = id(shunt_time_to_go).state;
                              root["starter_voltage"] = id(shunt_starter_voltage).state;
                              root["pv_power"] = id(mppt_pv_power).state;
                              root["yield_today_kwh"] = id(mppt_yield_today).state;
                              root["mppt_current"] = id(mppt_battery_current).state;
                              root["load_current"] = id(mppt_load_current).state;
                              root["mppt_state"] = id(mppt_state).state;
                              root["gas_level"] = id(gas_level).state;
                              root["gas_temp"] = id(gas_temp).state;
                              root["gas_battery"] = id(gas_battery).state;
                              root["room_temp"] = id(room_temp).state;
                              root["room_humidity"] = id(room_humidity).state;
                              root["room_battery"] = id(room_battery).state;
                              root["multiplus_temp"] = id(multiplus_temp).state;
                              root["multiplus_battery"] = id(multiplus_battery).state;
                              root["fridge_temp"] = std::isnan(id(fridge_temp_ext).state)
                                  ? id(fridge_temp_int).state : id(fridge_temp_ext).state;
                              root["fridge_battery"] = id(fridge_battery).state;
                              root["freezer_temp"] = id(freezer_temp).state;
                              root["freezer_battery"] = id(freezer_battery).state;
                              root["cell1"] = id(bms_cell1).state;
                              root["cell2"] = id(bms_cell2).state;
                              root["cell3"] = id(bms_cell3).state;
                              root["cell4"] = id(bms_cell4).state;
                              root["bms_temp"] = id(bms_temp).state;
                              root["bms_cycles"] = id(bms_cycles).state;
                              root["bms_fault"] = id(bms_fault).state;
                              root["bms_soc"] = id(bms_soc).state;
                              // Skipped cycles since the last report and
                              // last reset reason (0 = none, 9 = brownout,
                              // 4 = crash, 5 to 7 = watchdog)
                              root["skipped"] = id(skipped_cycles);
                              root["fault"] = id(last_fault);
                              // Planned sleep time and awake time so far;
                              // Home Assistant calculates the next report from them.
                              root["next_min"] = id(next_sleep_min);
                              root["awake_s"] = (int) (millis() / 1000);
                            on_response:
                              then:
                                - lambda: |-
                                    id(send_ok) = (response->status_code == 200);
                                    ESP_LOGI("send", "Response from Home Assistant: HTTP %d", response->status_code);
                            on_error:
                              then:
                                - logger.log:
                                    level: WARN
                                    format: "Send: no response from Home Assistant"
            - if:
                condition:
                  lambda: 'return id(send_ok);'
                then:
                  - logger.log: "Values sent"
                  # Reset the error counters, they have been reported now.
                  - lambda: |-
                      if (id(skipped_cycles) != 0 || id(last_fault) != 0) {
                        id(skipped_cycles) = 0;
                        id(last_fault) = 0;
                        skipped_cycles->on_shutdown();
                        last_fault->on_shutdown();
                        global_preferences->sync();
                      }
                else:
                  - logger.log:
                      level: WARN
                      format: "Report not delivered"
          else:
            - logger.log:
                level: WARN
                format: "No tunnel within the wait time"

      - script.execute: go_to_sleep

  # Sets how long to sleep after this cycle. Runs before sending
  # so Home Assistant learns the time until the next report.
  - id: plan_sleep
    mode: single
    then:
      - lambda: |-
          // State of charge from the shunt, BMS as fallback
          float soc = id(shunt_soc).state;
          if (std::isnan(soc)) {
            soc = id(bms_soc).state;
          }
          if (!std::isnan(soc) && soc < ${soc_alert_threshold}) {
            ESP_LOGI("sleep", "Low state of charge: next sleep ${sleep_alert_min} min");
            id(next_sleep_min) = ${sleep_alert_min};
            return;
          }
          // Report less often at night. Without a valid time the
          // normal interval applies.
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            const int start = ${night_start_hour};
            const int end = ${night_end_hour};
            const bool night = (start > end)
                ? (now.hour >= start || now.hour < end)
                : (now.hour >= start && now.hour < end);
            if (night) {
              // Wake up towards the end of the night if possible, but
              // never sleep shorter than the normal interval.
              const int until_end = ((end - now.hour + 24) % 24) * 60 - now.minute;
              int mins = ${sleep_night_min};
              if (until_end < mins) {
                mins = until_end;
              }
              if (mins < ${sleep_normal_min}) {
                mins = ${sleep_normal_min};
              }
              ESP_LOGI("sleep", "Night (%02d:%02d): next sleep %d min", now.hour, now.minute, mins);
              id(next_sleep_min) = mins;
              return;
            }
          }
          ESP_LOGI("sleep", "Next sleep ${sleep_normal_min} min");
          id(next_sleep_min) = ${sleep_normal_min};

  - id: go_to_sleep
    mode: single
    then:
      # If nothing was sent before (boot-failure guard), plan now.
      - if:
          condition:
            lambda: 'return id(next_sleep_min) <= 0;'
          then:
            - script.execute: plan_sleep
            - script.wait: plan_sleep
      - if:
          condition:
            lambda: 'return ${stay_awake};'
          then:
            - logger.log: "Test mode: staying awake"
          else:
            # The modem is shut down via AT+CPOF in on_shutdown;
            # this applies to this path as well as to the emergency brake.
            # Wake up earlier at low state of charge.
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: !lambda |-
                  // Guard: never go to sleep with 0 minutes, that would be
                  // an endless loop of waking up and falling asleep.
                  int mins = id(next_sleep_min);
                  if (mins <= 0) {
                    mins = ${sleep_normal_min};
                  }
                  return mins * 60 * 1000;
